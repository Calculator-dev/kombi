# Render Blueprint: API + website on the free tier; the database is on Supabase.
# Render dashboard → New → Blueprint → pick this repository.
#
# Free tier limits: services sleep after 15 minutes without traffic (the first
# visit after that takes ~1 minute). Switch `plan` to starter for real traffic.
#
# Render gives each service a URL from its name (https://kombi-api.onrender.com).
# If a name is taken, Render adds a suffix: then update API_URL and WEB_ORIGIN.

services:
  - type: web
    name: kombi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      # Supabase → Connect → Session pooler (port 5432) URI, with the database password.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      # Logins: Supabase Auth of the same project.
      - key: SUPABASE_URL
        sync: false
      # Comma-separated: these emails are platform admins (approve owners, see every van).
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # Van photos (Backblaze B2, S3-compatible).
      - key: BACKBLAZE_ENDPOINT
        sync: false
      - key: BACKBLAZE_REGION
        sync: false
      - key: BACKBLAZE_KEY_ID
        sync: false
      - key: BACKBLAZE_APP_KEY
        sync: false
      - key: BACKBLAZE_BUCKET_NAME
        sync: false
      - key: WEB_ORIGIN
        value: https://kombi-web.onrender.com
      - key: OWNER_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: web
    name: kombi-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 3000
      # Free services cannot receive private-network traffic, so the site uses the API's public URL.
      - key: API_URL
        value: https://kombi-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kombi-web.onrender.com
      # Supabase Auth in the admin panel. Both values are public (the publishable key, not the secret one).
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
