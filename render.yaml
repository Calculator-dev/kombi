# Render Blueprint: PostgreSQL + API + website, all on the free tier.
# Render dashboard → New → Blueprint → pick this repository.
#
# Free tier limits: services sleep after 15 minutes without traffic (the first
# visit after that takes ~1 minute), and the free database expires after 30 days.
# Switch `plan` to starter / basic-256mb before taking real bookings.
#
# Render gives each service a URL from its name (https://kombi-api.onrender.com).
# If a name is taken, Render adds a suffix: then update API_URL and WEB_ORIGIN.

databases:
  - name: kombi-db
    databaseName: kombi
    user: kombi
    plan: free
    region: frankfurt

services:
  - type: web
    name: kombi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: kombi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Output of `npm run hash-password -- "..."`, WITHOUT the surrounding quotes.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: WEB_ORIGIN
        value: https://kombi-web.onrender.com
      - key: OWNER_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: web
    name: kombi-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 3000
      # Free services cannot receive private-network traffic, so the site uses the API's public URL.
      - key: API_URL
        value: https://kombi-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kombi-web.onrender.com
