# Production-like stack: PostgreSQL + API + website.
#   fill in apps/api/.env (Supabase, Backblaze, PLATFORM_ADMIN_EMAILS)
#   docker compose up -d --build
# Put a reverse proxy with HTTPS (e.g. Caddy) in front of port 3000.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kombi
      POSTGRES_USER: kombi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kombi"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://kombi:${POSTGRES_PASSWORD:-change-me}@db:5432/kombi
      DATABASE_SSL: "off"
      PORT: 4000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"

volumes:
  pgdata:
